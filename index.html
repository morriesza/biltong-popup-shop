<!DOCTYPE html>
<meta charset="utf-8">
<title>Biltong Floor Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a8611f">
<link rel="apple-touch-icon" href="img/SafariCafe-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#f6f1e8;
    --surface:#ffffff;
    --surface-2:#efe6d6;
    --border:#ddccae;
    --text:#241d13;
    --text-dim:#7a6b52;
    --accent:#a8611f;
    --accent-strong:#8a4d15;
    --accent-soft:#f0dcc0;
    --good:#4b7a3e;
    --good-soft:#e2ecdb;
    --warn:#a8790f;
    --warn-soft:#f5e8c6;
    --bad:#a8341f;
    --bad-soft:#f6ded8;
    --shadow: 0 1px 2px rgba(36,29,19,.06), 0 6px 16px rgba(36,29,19,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#161109;
      --surface:#211a10;
      --surface-2:#2b2216;
      --border:#3d3120;
      --text:#f3ead9;
      --text-dim:#b4a487;
      --accent:#e0913f;
      --accent-strong:#f0aa5c;
      --accent-soft:#3a2916;
      --good:#8fbf7a;
      --good-soft:#233420;
      --warn:#e0b93a;
      --warn-soft:#3a2f14;
      --bad:#e0725a;
      --bad-soft:#3a1e17;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#161109;
    --surface:#211a10;
    --surface-2:#2b2216;
    --border:#3d3120;
    --text:#f3ead9;
    --text-dim:#b4a487;
    --accent:#e0913f;
    --accent-strong:#f0aa5c;
    --accent-soft:#3a2916;
    --good:#8fbf7a;
    --good-soft:#233420;
    --warn:#e0b93a;
    --warn-soft:#3a2f14;
    --bad:#e0725a;
    --bad-soft:#3a1e17;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', 'Public Sans', sans-serif;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-wrap:balance;
    margin:0;
  }
  .tabular{ font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding-inline:16px;
    padding-block: calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 20px);
    gap:14px;
  }
  .logo-bar{
    display:block; width:calc(100% + 32px); margin-inline:-16px;
    max-height:130px; object-fit:contain; background:var(--surface); border-bottom:1px solid var(--border);
    padding-block:12px;
  }
  .topbar{
    position:sticky;
    top: env(safe-area-inset-top, 0px);
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--bg);
    padding-block:6px;
    margin-inline:-16px;
    padding-inline:16px;
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .mark{
    width:30px;height:30px;border-radius:8px;
    background:var(--accent); color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:15px;
    flex:none;
  }
  .brand .name{ font-size:15px; font-weight:700; letter-spacing:.03em; }
  .who{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--text-dim);
  }
  .who .dot{ width:7px;height:7px;border-radius:50%;background:var(--good); flex:none; }
  .iconbtn{
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
    border-radius:9px; padding:7px 10px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .iconbtn:active{ background:var(--surface-2); }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    box-shadow:var(--shadow);
  }
  .muted{ color:var(--text-dim); }
  .eyebrow{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.12em;
    font-size:11.5px; color:var(--text-dim); font-weight:600;
  }

  /* ---- Login ---- */
  #screen-login{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:22px; padding-block:20px; }
  .login-hero{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .login-hero .mark{
    width:56px;height:56px;border-radius:16px;background:var(--accent); color:#fff;
    display:flex;align-items:center;justify-content:center; font-family:'Oswald',sans-serif;
    font-weight:700; font-size:26px; box-shadow:var(--shadow);
  }
  .login-hero h1{ font-size:22px; }
  .login-hero p{ margin:0; color:var(--text-dim); font-size:13.5px; }
  .pin-display{
    display:flex; justify-content:center; gap:12px; margin-block:4px;
  }
  .pin-dot{
    width:16px;height:16px;border-radius:50%;border:2px solid var(--border); background:transparent;
    transition:background .12s, border-color .12s;
  }
  .pin-dot.filled{ background:var(--accent); border-color:var(--accent); }
  .pin-dot.err{ background:var(--bad); border-color:var(--bad); }
  .keypad{
    display:grid; grid-template-columns:repeat(4,1fr); gap:9px; max-width:320px; margin-inline:auto; width:100%;
  }
  .key{
    aspect-ratio:1; border-radius:14px; border:1px solid var(--border); background:var(--surface);
    font-family:'Oswald',sans-serif; font-size:19px; font-weight:600; color:var(--text);
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow);
  }
  .key:active{ background:var(--surface-2); }
  .key.ghost{ background:transparent; border-color:transparent; box-shadow:none; color:var(--text-dim); font-size:14px; }
  .login-err{
    text-align:center; color:var(--bad); font-size:13px; font-weight:600; min-height:18px;
  }

  /* ---- Home grid ---- */
  .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin-block-start:4px;}
  .section-title h2{ font-size:13px; }
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile{
    border-radius:16px; border:1px solid var(--border); padding:16px 14px;
    display:flex; flex-direction:column; gap:20px; cursor:pointer; text-align:left;
    box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .tile .glyph{ width:30px;height:30px; flex:none; }
  .tile .lbl{ font-family:'Oswald',sans-serif; font-size:15px; font-weight:600; text-transform:uppercase; letter-spacing:.02em; }
  .tile .sub{ font-size:11.5px; margin-top:4px; }
  .tile.time{ background:var(--surface); color:var(--text); }
  .tile.time .sub{ color: var(--text-dim); }
  .tile.stock{ background:var(--accent-soft); color:var(--accent-strong); }
  .tile.stock .sub{ color:var(--accent-strong); opacity:.75; }
  .tile.cash{ background:var(--good-soft); color:var(--good); }
  .tile.cash .sub{ color:var(--good); opacity:.8; }
  .tile.out{ }
  .status-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 10px;
    font-size:11.5px; font-weight:600; border:1px solid transparent;
  }
  .pill.open{ background:var(--good-soft); color:var(--good); }
  .pill.pending{ background:var(--warn-soft); color:var(--warn); }
  .pill.closed{ background:var(--surface-2); color:var(--text-dim); }
  .pill.low{ background:var(--bad-soft); color:var(--bad); }

  .alertbar{
    display:flex; gap:10px; align-items:flex-start; background:var(--bad-soft); color:var(--bad);
    border:1px solid var(--bad); border-radius:12px; padding:12px 14px; font-size:13px; font-weight:600;
  }
  .installbar{
    display:flex; gap:10px; align-items:center; background:var(--accent-soft); color:var(--accent-strong);
    border:1px solid var(--accent); border-radius:12px; padding:10px 12px; font-size:12.5px; font-weight:600;
  }
  .installbar .txt{ flex:1; }
  .installbar button{ font-family:inherit; font-weight:700; font-size:12.5px; border-radius:8px; border:none; padding:7px 11px; cursor:pointer; white-space:nowrap; }
  .installbar .go{ background:var(--accent); color:#fff; }
  .installbar .dismiss{ background:transparent; color:var(--accent-strong); opacity:.75; }

  /* ---- forms ---- */
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; }
  .field input, .field select{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:10px; padding:11px 12px; font-size:15px; font-family:inherit; width:100%;
  }
  .field input:focus, .field select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .weigh-row{
    display:flex; align-items:center; gap:10px; padding-block:10px; border-bottom:1px solid var(--border);
  }
  .weigh-row:last-child{ border-bottom:none; }
  .weigh-row .name{ flex:1; font-weight:600; font-size:14.5px; }
  .weigh-row .name .thr{ display:block; font-size:11px; font-weight:400; color:var(--text-dim); }
  .weigh-row input{ width:92px; text-align:right; }
  .weigh-row .unit{ font-size:12px; color:var(--text-dim); width:22px; }
  .flag{ color:var(--bad); font-weight:700; font-size:11px; }

  .btn{
    border:none; border-radius:12px; padding:14px; font-size:14.5px; font-weight:700; cursor:pointer;
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.03em;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:active{ background:var(--accent-strong); }
  .btn-ghost{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn-danger{ background:var(--bad); color:#fff; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btnrow{ display:flex; gap:10px; }
  .backrow{ display:flex; align-items:center; gap:8px; margin-block-end:2px; }
  .backrow button{
    background:none;border:none;color:var(--text-dim); font-weight:600; font-size:13px; cursor:pointer;
    display:flex; align-items:center; gap:4px; padding:4px 0;
  }

  .list-row{ display:flex; align-items:center; gap:10px; padding-block:11px; border-bottom:1px solid var(--border); }
  .list-row:last-child{ border-bottom:none; }
  .list-row .main{ flex:1; min-width:0; }
  .list-row .t{ font-weight:600; font-size:14px; }
  .list-row .s{ font-size:12px; color:var(--text-dim); }
  .swatch{ width:10px;height:10px;border-radius:3px;flex:none; }

  .empty{ text-align:center; padding:28px 10px; color:var(--text-dim); font-size:13.5px; }

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 22px); transform:translateX(-50%);
    background:var(--text); color:var(--bg); padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    box-shadow:var(--shadow); z-index:50; max-width:88%; text-align:center;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  textarea{
    width:100%; min-height:130px; border:1px solid var(--border); border-radius:10px; padding:11px;
    font-family:ui-monospace, monospace; font-size:12.5px; background:var(--surface); color:var(--text);
  }
  .tag{ display:inline-block; background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:2px 7px; font-size:11px; color:var(--text-dim); }

  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- Firebase (only loaded/used when the shop configures it) -->
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script>
(function(){
  "use strict";

  /* ============================= DATA LAYER =============================
     Two backends behind one API:
       - "cloud": Firestore, when the shop has pasted in a Firebase config
       - "demo": localStorage, seeded with sample data, used until then
     Firestore client config is not a secret (security comes from Firestore
     rules), so it's safe to store it directly on the page via localStorage
     on each device, or bake it into the file once the shop shares it.
  ========================================================================= */

  // The shop's live Firebase project. Ships with the app so every phone
  // connects automatically - see the note in DB.init() for why this is safe
  // to have in plain sight. Set to null to make a fresh copy of this file
  // start in local demo mode again.
  var EMBEDDED_FIREBASE_CONFIG = {
    apiKey: "AIzaSyCdNdsWpz0Olcby-mZXtTJX-2rDb-9iSU4",
    authDomain: "biltong-popup-toowong.firebaseapp.com",
    projectId: "biltong-popup-toowong",
    storageBucket: "biltong-popup-toowong.firebasestorage.app",
    messagingSenderId: "1081776861863",
    appId: "1:1081776861863:web:2260bfa7182fc54c6fe182",
    measurementId: "G-YF4HQFMSM5"
  };

  // End-of-day email report, sent via EmailJS (a client-side email service -
  // no server needed). It ships with the file just like the Firebase config
  // above, so every device sends from the same setup. Leave null and reports
  // are skipped. The repo is public, so the recipient address is NOT stored
  // here: it is typed straight into the EmailJS template's "To Email" field,
  // which also stops anyone reusing these IDs to email other people.
  var EMBEDDED_EMAILJS_CONFIG = {
    serviceId: "service_u98pame",
    templateId: "template_u19jdeu",
    publicKey: "pUmL3B0hCd3u6cW-0"
  };

  // Square sales check. The Square access token is a real secret, so it lives
  // only in a small Cloudflare Worker (square-worker/worker.js in this repo);
  // the app just calls that worker's public URL, which returns grams sold per
  // item and nothing else. Leave null and the stock check is skipped.
  var EMBEDDED_SQUARE_CONFIG = { salesUrl: "https://biltong-square.mroets.workers.dev" };

  // A flavour is flagged at Stock-Out when the grams that went missing (after
  // the drying estimate) are more than this many grams AND this percentage of
  // what Square says was sold - i.e. more than normal taster use - or when
  // there is more on the scale than expected by more than RECON_OVER_G.
  var RECON_TOLERANCE_G = 100;
  var RECON_TOLERANCE_PCT = 15;
  var RECON_OVER_G = 50;

  // Cash is counted note-by-note and coin-by-coin rather than as one typed
  // total, so a miscount is easy to spot and the exact tally is on record.
  var DENOMINATIONS = [
    { key:"100", label:"$100", value:100 },
    { key:"50", label:"$50", value:50 },
    { key:"20", label:"$20", value:20 },
    { key:"10", label:"$10", value:10 },
    { key:"5", label:"$5", value:5 },
    { key:"2", label:"$2", value:2 },
    { key:"1", label:"$1", value:1 },
    { key:"0.50", label:"50c", value:0.5 },
    { key:"0.20", label:"20c", value:0.2 },
    { key:"0.10", label:"10c", value:0.1 },
    { key:"0.05", label:"5c", value:0.05 }
  ];

  var PIN_LENGTH = 6;
  var PIN_PATTERN = /^[0-9ABC]{6}$/;

  var LS_CONFIG = "biltong_firebase_config";
  var LS_EMAIL_CONFIG = "biltong_emailjs_config";
  var LS_DEMO = "biltong_demo_db_v1";
  var LS_SESSION = "biltong_session_employee";
  var LS_THEME = "biltong_theme";
  var LS_INSTALL_DISMISSED = "biltong_install_dismissed";

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function todayKey(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function fmtTime(ts){ var d = new Date(ts); return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}); }
  function fmtDateTime(ts){ var d = new Date(ts); return d.toLocaleDateString([], {day:"2-digit", month:"short"}) + " - " + fmtTime(ts); }
  function fmtMoney(n){ return "$" + (Math.round(n*100)/100).toFixed(2); }

  function seedDemo(){
    return {
      employees: [
        { id:"emp-boss", pin:"9A9B9C", name:"Owner", isAdmin:true },
        { id:"emp-1", pin:"1A1B1C", name:"Thabo", isAdmin:false },
        { id:"emp-2", pin:"2A2B2C", name:"Aiden", isAdmin:false }
      ],
      flavours: [
        { id:"f-trad", name:"Traditional", thresholdG:1500, lastStockG:4200, lastStockAt:Date.now()-1000*60*60*20 },
        { id:"f-chilli", name:"Chilli Bites", thresholdG:1000, lastStockG:850, lastStockAt:Date.now()-1000*60*60*20 },
        { id:"f-peri", name:"Peri-Peri", thresholdG:1000, lastStockG:2100, lastStockAt:Date.now()-1000*60*60*20 },
        { id:"f-droe", name:"Droewors", thresholdG:800, lastStockG:1200, lastStockAt:Date.now()-1000*60*60*20 }
      ],
      events: []
    };
  }

  function loadDemo(){
    try{
      var raw = localStorage.getItem(LS_DEMO);
      if(!raw){ var d = seedDemo(); localStorage.setItem(LS_DEMO, JSON.stringify(d)); return d; }
      return JSON.parse(raw);
    }catch(e){ return seedDemo(); }
  }
  function saveDemo(db){ try{ localStorage.setItem(LS_DEMO, JSON.stringify(db)); }catch(e){} }

  var DB = {
    mode: "demo", // "demo" | "cloud"
    _demo: null,
    _fs: null,
    _listeners: [],

    init: function(){
      var self = this;
      // EMBEDDED_FIREBASE_CONFIG (below) ships with the file itself, so every
      // device that opens this page connects to the same shared database
      // automatically - nobody has to paste anything in. It's not a secret:
      // a Firebase web config only identifies the project: real protection
      // comes from the Firestore security rules, not from hiding this.
      // The Manage -> Database screen still exists as a manual override/fallback
      // (e.g. testing against a different project), and takes priority if set.
      var cfg = EMBEDDED_FIREBASE_CONFIG;
      var cfgRaw = null;
      try{ cfgRaw = localStorage.getItem(LS_CONFIG); }catch(e){}
      if(cfgRaw){
        try{ cfg = JSON.parse(cfgRaw); }
        catch(e){ console.warn("Stored Firebase config invalid, ignoring it.", e); }
      }
      if(cfg && cfg.apiKey && cfg.projectId){
        try{
          if(!firebase.apps.length){ firebase.initializeApp(cfg); }
          self._fs = firebase.firestore();
          self.mode = "cloud";
          return Promise.resolve();
        }catch(e){
          console.warn("Firebase init failed, falling back to demo mode.", e);
        }
      }
      self._demo = loadDemo();
      self.mode = "demo";
      return Promise.resolve();
    },

    isCloud: function(){ return this.mode === "cloud"; },
    isCloudConfigured: function(){
      try{ if(localStorage.getItem(LS_CONFIG)) return true; }catch(e){}
      return !!(EMBEDDED_FIREBASE_CONFIG && EMBEDDED_FIREBASE_CONFIG.apiKey);
    },

    setCloudConfig: function(cfgObj){
      localStorage.setItem(LS_CONFIG, JSON.stringify(cfgObj));
    },
    clearCloudConfig: function(){
      localStorage.removeItem(LS_CONFIG);
    },

    getEmployees: function(){
      if(this.mode === "demo") return Promise.resolve(this._demo.employees.slice());
      return this._fs.collection("employees").get().then(function(snap){
        var out = []; snap.forEach(function(doc){ out.push(Object.assign({id:doc.id}, doc.data())); });
        return out;
      });
    },
    saveEmployee: function(emp){
      if(this.mode === "demo"){
        var list = this._demo.employees;
        var i = list.findIndex(function(e){ return e.id === emp.id; });
        if(i>=0) list[i] = emp; else list.push(emp);
        saveDemo(this._demo);
        return Promise.resolve(emp);
      }
      var id = emp.id || uid();
      var data = Object.assign({}, emp); delete data.id;
      return this._fs.collection("employees").doc(id).set(data).then(function(){ return Object.assign({id:id}, data); });
    },
    deleteEmployee: function(id){
      if(this.mode === "demo"){
        this._demo.employees = this._demo.employees.filter(function(e){ return e.id !== id; });
        saveDemo(this._demo);
        return Promise.resolve();
      }
      return this._fs.collection("employees").doc(id).delete();
    },

    getFlavours: function(){
      if(this.mode === "demo") return Promise.resolve(this._demo.flavours.slice());
      return this._fs.collection("flavours").get().then(function(snap){
        var out = []; snap.forEach(function(doc){ out.push(Object.assign({id:doc.id}, doc.data())); });
        return out;
      });
    },
    saveFlavour: function(fl){
      if(this.mode === "demo"){
        var list = this._demo.flavours;
        var i = list.findIndex(function(f){ return f.id === fl.id; });
        if(i>=0) list[i] = fl; else list.push(fl);
        saveDemo(this._demo);
        return Promise.resolve(fl);
      }
      var id = fl.id || uid();
      var data = Object.assign({}, fl); delete data.id;
      return this._fs.collection("flavours").doc(id).set(data).then(function(){ return Object.assign({id:id}, data); });
    },
    deleteFlavour: function(id){
      if(this.mode === "demo"){
        this._demo.flavours = this._demo.flavours.filter(function(f){ return f.id !== id; });
        saveDemo(this._demo);
        return Promise.resolve();
      }
      return this._fs.collection("flavours").doc(id).delete();
    },

    // Deliberately narrow: a stock check-in/out only ever touches the two
    // "current reading" fields on a flavour, never its name or threshold.
    // This is also what the Firestore rules below allow an open write to do.
    updateStockReading: function(id, weightG){
      if(this.mode === "demo"){
        var f = this._demo.flavours.find(function(x){ return x.id === id; });
        if(f){ f.lastStockG = weightG; f.lastStockAt = Date.now(); saveDemo(this._demo); }
        return Promise.resolve();
      }
      return this._fs.collection("flavours").doc(id).update({
        lastStockG: weightG,
        lastStockAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    },

    // Adds to (rather than replaces) a flavour's current stock - used when a
    // delivery tops stock up mid-shift, as opposed to a check-in/check-out
    // weigh-in which sets an absolute reading.
    addStockDelivery: function(id, amountG){
      if(this.mode === "demo"){
        var f = this._demo.flavours.find(function(x){ return x.id === id; });
        if(f){ f.lastStockG = (f.lastStockG||0) + amountG; f.lastStockAt = Date.now(); saveDemo(this._demo); }
        return Promise.resolve();
      }
      return this._fs.collection("flavours").doc(id).update({
        lastStockG: firebase.firestore.FieldValue.increment(amountG),
        lastStockAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    },

    // Events are an append-only audit log: captured once, never edited or
    // deleted, by staff or the owner, from this app or from Firestore
    // rules. A mistake gets a new correcting entry, not a rewritten one.
    logEvent: function(evt){
      var self = this;
      if(this.mode === "demo"){
        evt = Object.assign({ id: uid(), createdAt: Date.now() }, evt);
        this._demo.events.unshift(evt);
        saveDemo(this._demo);
        return Promise.resolve(evt);
      }
      var id = uid();
      var data = Object.assign({}, evt, { createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      return this._fs.collection("events").doc(id).set(data).then(function(){
        return Object.assign({ id: id, createdAt: Date.now() }, evt);
      });
    },
    getEvents: function(limit){
      limit = limit || 400;
      if(this.mode === "demo") return Promise.resolve(this._demo.events.slice(0, limit));
      return this._fs.collection("events").orderBy("createdAt","desc").limit(limit).get().then(function(snap){
        var out = []; snap.forEach(function(doc){
          var d = doc.data();
          out.push(Object.assign({id:doc.id}, d, { createdAt: toMillis(d.createdAt) }));
        });
        return out;
      });
    }
  };

  function toMillis(ts){
    if(ts == null) return Date.now();
    if(typeof ts === "number") return ts;
    if(typeof ts.toMillis === "function") return ts.toMillis();
    if(typeof ts.seconds === "number") return ts.seconds * 1000;
    return Date.now();
  }

  /* ============================= EMAIL REPORTS =============================
     Sent client-side via EmailJS (no server needed, free tier). Uses either
     the config baked into the file (EMBEDDED_EMAILJS_CONFIG) or a per-device
     override saved under Manage -> Email Reports, same pattern as Firebase.
  =========================================================================== */
  function getEmailConfig(){
    var cfg = EMBEDDED_EMAILJS_CONFIG;
    var raw = null;
    try{ raw = localStorage.getItem(LS_EMAIL_CONFIG); }catch(e){}
    if(raw){
      try{ cfg = JSON.parse(raw); }catch(e){}
    }
    return (cfg && cfg.serviceId && cfg.templateId && cfg.publicKey) ? cfg : null;
  }

  function buildDailyReportText(){
    var day = todayKey();
    var lines = [];
    lines.push("Biltong Floor Log - end of day report for " + day);
    lines.push("");
    lines.push("STOCK (most recent reading):");
    state.flavours.forEach(function(f){
      var low = (f.lastStockG||0) <= (f.thresholdG||0);
      lines.push("- " + f.name + ": " + (f.lastStockG||0) + " g" + (low ? " (LOW - threshold " + f.thresholdG + " g)" : ""));
    });
    lines.push("");
    lines.push("CASH TODAY:");
    var todaysCash = state.events.filter(function(e){ return e.type === "cash" && todayKey(new Date(e.createdAt)) === day; });
    if(todaysCash.length){
      todaysCash.slice().reverse().forEach(function(e){
        var bd = formatCashBreakdown(e.breakdown);
        lines.push("- " + (e.dir==="in"?"Cash-In":"Cash-Out") + " by " + e.employeeName + ": " + fmtMoney(e.amount||0) + " at " + fmtTime(e.createdAt) + (bd ? " [" + bd + "]" : ""));
      });
    } else {
      lines.push("- No cash events logged today.");
    }
    lines.push("");
    lines.push("TIME TODAY:");
    var todaysTime = state.events.filter(function(e){ return e.type === "time" && todayKey(new Date(e.createdAt)) === day; });
    if(todaysTime.length){
      todaysTime.slice().reverse().forEach(function(e){
        lines.push("- " + e.employeeName + " " + (e.dir==="in"?"clocked in":"clocked out") + " at " + fmtTime(e.createdAt));
      });
    } else {
      lines.push("- No time events logged today.");
    }
    var check = latestStockCheck(day);
    if(check){
      lines.push("");
      lines.push("STOCK CHECK VS SQUARE (" + check.orders + " Square orders):");
      (check.rows||[]).forEach(function(r){
        if(r.missingG == null){ lines.push("- " + r.name + ": sold " + fmtG(r.soldG) + " (no Stock-In today to compare)"); return; }
        lines.push("- " + r.name + ": sold " + fmtG(r.soldG) + ", missing " + fmtG(r.missingG) +
          " (drying " + (r.dryingG == null ? "not known yet" : "~" + fmtG(r.dryingG)) + ", tasters ~" + fmtG(r.tastersG) +
          (r.tasterCents != null ? " = " + fmtMoney(r.tasterCents/100) : "") + ")" +
          (r.flag === "short" ? " CHECK: more missing than usual" : (r.flag === "over" ? " CHECK: more on the scale than expected" : "")));
      });
      if((check.unmatched||[]).length){
        lines.push("- Square items not matched to a flavour: " + check.unmatched.map(function(u){ return u.name + " (" + fmtG(u.grams) + ")"; }).join(", "));
      }
    }
    var todaysRestock = state.events.filter(function(e){ return e.type === "restock" && todayKey(new Date(e.createdAt)) === day; });
    if(todaysRestock.length){
      lines.push("");
      lines.push("STOCK DELIVERIES TODAY:");
      todaysRestock.slice().reverse().forEach(function(e){
        lines.push("- +" + e.amountG + " g " + e.flavourName + " (logged by " + e.employeeName + ")" + (e.note ? " - " + e.note : ""));
      });
    }
    return lines.join("\n");
  }

  function sendDailyReport(){
    var cfg = getEmailConfig();
    if(!cfg) return Promise.resolve();
    if(typeof emailjs === "undefined"){
      toast("Saved, but the email service didn't load (check internet)");
      return Promise.resolve();
    }
    var subject = "Biltong Floor Log - end of day report - " + todayKey();
    // title/name suit EmailJS's default "Contact Us" template. to_email is only
    // sent for a per-device override; the shared setup fixes the recipient in
    // the template itself.
    var params = {
      subject: subject,
      title: subject,
      name: "Biltong Floor Log",
      message: buildDailyReportText()
    };
    if(cfg.toEmail) params.to_email = cfg.toEmail;
    return emailjs.send(cfg.serviceId, cfg.templateId, params, cfg.publicKey).catch(function(err){
      console.error("Email report failed:", err);
      toast("Saved, but the email report didn't send");
    });
  }

  /* ============================= SQUARE STOCK CHECK ========================
     At Stock-Out the app asks the Square worker how many grams of each item
     were sold since Stock-In, then for every flavour works out:
       missing = opening + deliveries - sold in Square - closing
     Part of that is drying: the overnight drop between a Stock-Out and the
     next morning's Stock-In has no sales in it, so it gives a drying rate per
     hour that is applied to the trading day. Whatever is left is tasters
     (plus any weighing or ringing-up errors). The result is saved as a
     "sales" event, append-only like every other event.
  =========================================================================== */
  function getSquareConfig(){
    var cfg = EMBEDDED_SQUARE_CONFIG;
    return (cfg && cfg.salesUrl) ? cfg : null;
  }

  function squareGet(path){
    var cfg = getSquareConfig();
    if(!cfg) return Promise.reject(new Error("Square is not set up"));
    return fetch(cfg.salesUrl.replace(/\/+$/, "") + path).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(json){
        if(!res.ok || !json.ok) throw new Error(json.error || ("HTTP " + res.status));
        return json;
      });
    });
  }

  function normName(s){ return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]/g, ""); }

  // A Square item matches a flavour when the flavour name (or its "Square
  // item name" override) equals the item name, the variation name, or both.
  function matchFlavour(item){
    var cands = [item.name, item.variation, (item.name||"") + " " + (item.variation||"")].map(normName).filter(Boolean);
    return state.flavours.find(function(f){
      return [normName(f.name), normName(f.squareName)].some(function(k){ return k && cands.indexOf(k) >= 0; });
    }) || null;
  }

  function byCreatedAsc(a, b){ return a.createdAt - b.createdAt; }

  // Average fraction of weight lost per hour overnight, from up to the last
  // 10 nights where a Stock-Out was followed by a Stock-In on a later day.
  function getDryingRate(flavourId){
    var evs = state.events.filter(function(e){
      return (e.type === "stock" && e.readings && e.readings[flavourId] != null) || (e.type === "restock" && e.flavourId === flavourId);
    }).slice().sort(byCreatedAsc);
    var rates = []; var lastOut = null; var delivered = 0;
    evs.forEach(function(e){
      if(e.type === "restock"){ if(lastOut) delivered += (e.amountG||0); return; }
      if(e.dir === "out"){ lastOut = e; delivered = 0; return; }
      if(lastOut && todayKey(new Date(lastOut.createdAt)) !== todayKey(new Date(e.createdAt))){
        var start = lastOut.readings[flavourId] + delivered;
        var hours = (e.createdAt - lastOut.createdAt) / 3600000;
        if(start > 0 && hours >= 4){ rates.push((start - e.readings[flavourId]) / start / hours); }
      }
      lastOut = null;
    });
    rates = rates.slice(-10);
    if(!rates.length) return { rate: 0, nights: 0 };
    var avg = rates.reduce(function(a, b){ return a + b; }, 0) / rates.length;
    return { rate: Math.max(0, avg), nights: rates.length };
  }

  function buildStockCheck(outEvt, sales){
    var day = todayKey(new Date(outEvt.createdAt));
    // state.events is newest-first, so the first match is the latest Stock-In.
    var inEvt = state.events.find(function(e){
      return e.type === "stock" && e.dir === "in" && e.createdAt <= outEvt.createdAt && todayKey(new Date(e.createdAt)) === day;
    }) || null;

    var soldG = {}; var salesCents = {}; var unmatched = [];
    (sales.items || []).forEach(function(it){
      var f = matchFlavour(it);
      if(!f){ unmatched.push({ name: (it.name||"") + (it.variation ? " - " + it.variation : ""), grams: Math.round(it.grams||0) }); return; }
      soldG[f.id] = (soldG[f.id]||0) + (it.grams||0);
      salesCents[f.id] = (salesCents[f.id]||0) + (it.cents||0);
    });

    var hours = inEvt ? (outEvt.createdAt - inEvt.createdAt) / 3600000 : 0;
    var rows = state.flavours.map(function(f){
      var sold = Math.round(soldG[f.id]||0);
      var close = outEvt.readings ? outEvt.readings[f.id] : null;
      var open = inEvt && inEvt.readings ? inEvt.readings[f.id] : null;
      var row = { flavourId: f.id, name: f.name, soldG: sold, salesCents: salesCents[f.id]||0,
        openG: open == null ? null : open, closeG: close == null ? null : close,
        deliveredG: 0, missingG: null, dryingG: null, tastersG: null, tasterCents: null, flag: "" };
      if(open == null || close == null) return row;
      state.events.forEach(function(e){
        if(e.type === "restock" && e.flavourId === f.id && e.createdAt > inEvt.createdAt && e.createdAt <= outEvt.createdAt){ row.deliveredG += (e.amountG||0); }
      });
      var missing = open + row.deliveredG - sold - close;
      var dr = getDryingRate(f.id);
      var drying = Math.max(0, (open + row.deliveredG + close) / 2 * dr.rate * hours);
      row.missingG = Math.round(missing);
      row.dryingG = dr.nights ? Math.round(drying) : null;
      row.tastersG = Math.round(Math.max(0, missing - drying));
      if(sold > 0 && row.salesCents > 0){ row.tasterCents = Math.round(row.tastersG * row.salesCents / sold); }
      var unexplained = missing - drying;
      if(unexplained > Math.max(RECON_TOLERANCE_G, sold * RECON_TOLERANCE_PCT / 100)) row.flag = "short";
      else if(missing < -RECON_OVER_G) row.flag = "over";
      return row;
    });

    return {
      type: "sales",
      stockOutId: outEvt.id || null,
      stockInId: inEvt ? (inEvt.id || null) : null,
      day: day,
      fromMs: inEvt ? inEvt.createdAt : null,
      toMs: outEvt.createdAt,
      orders: sales.orders || 0,
      rows: rows,
      unmatched: unmatched,
      unweighed: (sales.unweighed || []).map(function(u){ return { name: (u.name||"") + (u.variation ? " - " + u.variation : ""), qty: u.qty||0 }; }),
      flagged: rows.filter(function(r){ return r.flag; }).map(function(r){ return r.name; })
    };
  }

  // Runs the check for a Stock-Out event and logs the result. Resolves to the
  // saved "sales" event, or null if Square is not set up or could not be read
  // (the Stock-Out itself is already saved either way).
  function runStockCheck(outEvt){
    if(!getSquareConfig() || !outEvt) return Promise.resolve(null);
    var day = todayKey(new Date(outEvt.createdAt));
    var inEvt = state.events.find(function(e){
      return e.type === "stock" && e.dir === "in" && e.createdAt <= outEvt.createdAt && todayKey(new Date(e.createdAt)) === day;
    });
    var from = inEvt ? inEvt.createdAt : new Date(new Date(outEvt.createdAt).setHours(0,0,0,0)).getTime();
    var path = "/sales?from=" + encodeURIComponent(new Date(from).toISOString()) + "&to=" + encodeURIComponent(new Date(outEvt.createdAt).toISOString());
    return squareGet(path).then(function(sales){
      var check = buildStockCheck(outEvt, sales);
      check.employeeId = state.employee.id;
      check.employeeName = state.employee.name;
      return DB.logEvent(check);
    }).then(function(saved){
      return refreshEvents().then(function(){ return saved; });
    }).catch(function(err){
      console.error("Square stock check failed:", err);
      toast("Stock saved, but Square sales could not be loaded");
      return null;
    });
  }

  function latestStockCheck(day){
    return state.events.find(function(e){ return e.type === "sales" && e.day === day; }) || null;
  }

  function fmtG(n){ return n == null ? "-" : (Math.round(n) + " g"); }

  /* ============================= APP STATE =============================== */

    screen: "login",

    pinError: "",
    employee: null,

  function isStandaloneDisplay(){

        || window.navigator.standalone === true;
    }catch(e){ return false; }
  }
  function isIOSDevice(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent || "") && !window.MSStream;
  }

  var deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredInstallPrompt = e;

  });

  function renderInstallBanner(){
    if(isStandaloneDisplay() || state.installDismissed) return "";
    if(state.canInstall){
      return '<div class="installbar">' +
        '<div class="txt">Install this on your phone for one-tap access.</div>' +
        '<button class="go" id="btn-install-app">Install</button>' +
        '<button class="dismiss" id="btn-dismiss-install">Later</button>' +
      '</div>';
    }
    if(isIOSDevice()){
      return '<div class="installbar">' +
        '<div class="txt">Add this to your Home Screen: tap Share, then "Add to Home Screen".</div>' +
        '<button class="dismiss" id="btn-dismiss-install">Got it</button>' +
      '</div>';
    }
    return "";
  }
  function bindInstallBanner(){
    var go = document.getElementById("btn-install-app");
    if(go) go.addEventListener("click", function(){
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      deferredInstallPrompt.userChoice.then(function(){ deferredInstallPrompt = null; });
    });
    var dismiss = document.getElementById("btn-dismiss-install");
    if(dismiss) dismiss.addEventListener("click", function(){
      state.installDismissed = true;
      try{ localStorage.setItem(LS_INSTALL_DISMISSED, "1"); }catch(e){}

  function reportSaveError(err){
    console.error("Save failed:", err);
    var msg = (err && err.message) || String(err);
    if(/permission/i.test(msg)) toast("The database rejected that change - check the Firestore rules");
    else toast("Couldn't save: " + msg);
  }

  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 2400);
  }

  // Renders the shop logo, falling back to the plain "B" badge if the image
  // isn't found (e.g. previewing this page somewhere without img/ alongside it).
  function renderMark(size){
    return '<img src="img/SafariCafe-logo.png" alt="Safari Cafe" data-size="'+size+'" ' +
      'style="width:'+size+'px;height:'+size+'px;object-fit:contain;border-radius:'+Math.round(size*0.28)+'px;flex:none;" ' +
      'onerror="handleLogoError(this)">';
  }
  window.handleLogoError = function(img){
    var size = parseInt(img.getAttribute('data-size'), 10) || 30;
    var div = document.createElement('div');
    div.className = 'mark';
    div.style.width = size + 'px';
    div.style.height = size + 'px';
    div.style.fontSize = Math.round(size * 0.42) + 'px';
    div.textContent = 'B';
    img.replaceWith(div);
  };

  /* ============================= RENDER ============================== */

  var app = document.getElementById("app");

  function render(){
    var s = state;
    if(s.bootError){ app.innerHTML = renderBootError(s.bootError); bindBootError(); return; }
    if(s.loading){ app.innerHTML = renderLoading(); return; }
    if(!s.employee){ app.innerHTML = renderLogin(); bindLogin(); return; }

    var html = renderTopbar() + renderInstallBanner() + renderAlertBanner();

    switch(s.screen){
      case "home": html += renderHome(); break;
      case "time": html += renderTime(s.formData.dir); break;
      case "stock": html += renderStock(s.formData.dir); break;
      case "cash": html += renderCash(s.formData.dir); break;
      case "admin": html += renderAdmin(); break;
      case "admin-flavours": html += renderAdminFlavours(); break;
      case "admin-flavour-edit": html += renderFlavourEdit(s.formData.id); break;
      case "admin-employees": html += renderAdminEmployees(); break;
      case "admin-employee-edit": html += renderEmployeeEdit(s.formData.id); break;
      case "admin-log": html += renderAdminLog(); break;
      case "admin-connect": html += renderAdminConnect(); break;
      case "admin-stocklog": html += renderStockLog(); break;

  function lowStockList(){

  // One closing (stock-out) reading per day, oldest to newest, for trend
  // tracking. state.events is newest-first, so the first stock-out event
  // seen for a given day is already that day's latest reading.
  function getStockOutHistory(flavourId, days){
    days = days || 10;
    var byDay = {};
    state.events.forEach(function(e){
      if(e.type === "stock" && e.dir === "out" && e.readings && e.readings[flavourId] != null){
        var day = todayKey(new Date(e.createdAt));
        if(!byDay[day]) byDay[day] = { day: day, value: e.readings[flavourId], createdAt: e.createdAt };
      }
    });
    var list = Object.keys(byDay).map(function(k){ return byDay[k]; });
    list.sort(function(a,b){ return a.day < b.day ? -1 : (a.day > b.day ? 1 : 0); });
    return list.slice(-days);
  }
  function getRestockHistory(flavourId, limit){
    limit = limit || 5;
    return state.events.filter(function(e){ return e.type === "restock" && e.flavourId === flavourId; }).slice(0, limit);
  }

  function computeCashTotal(){
    var total = 0;
    document.querySelectorAll(".weigh-row[data-denom]").forEach(function(row){
      var val = parseFloat(row.getAttribute("data-value")) || 0;
      var count = parseInt(row.querySelector(".denom-input").value, 10) || 0;
      total += val * count;
    });
    return Math.round(total * 100) / 100;
  }
  function formatCashBreakdown(breakdown){
    if(!breakdown) return "";
    return DENOMINATIONS.filter(function(d){ return breakdown[d.key]; })
      .map(function(d){ return breakdown[d.key] + "x" + d.label; }).join(", ");
  }

  function renderAdminLog(){
    var evs = state.events.slice(0, 100);
    var rows = evs.map(function(e){
      var label = "", detail = "", color = "var(--text-dim)";
      if(e.type === "time"){ label = "Time-"+(e.dir==="in"?"In":"Out"); detail = e.employeeName; color = e.dir==="in" ? "var(--good)" : "var(--bad)"; }

        var bd = formatCashBreakdown(e.breakdown);

      if(e.type === "stock"){
        var low = (e.flagged||[]).length;
        label = "Stock-"+(e.dir==="in"?"In":"Out"); detail = e.employeeName + (low ? " - "+low+" low" : "");
        color = low ? "var(--bad)" : "var(--accent)";

  function renderStockLog(){
    var cards = state.flavours.map(function(f){
      var hist = getStockOutHistory(f.id, 10);
      var restocks = getRestockHistory(f.id, 5);
      var max = Math.max(f.thresholdG||0, 1);
      hist.forEach(function(h){ if(h.value > max) max = h.value; });
      var trendRows = hist.length ? hist.map(function(h){
        var pct = Math.max(4, Math.round((h.value/max)*100));
        var low = h.value <= (f.thresholdG||0);
        return '<div style="padding-block:6px;border-bottom:1px solid var(--border);">' +
          '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);"><span>'+h.day+'</span><span class="tabular">'+h.value+' g</span></div>' +
          '<div style="background:var(--surface-2);border-radius:6px;height:7px;margin-top:4px;overflow:hidden;">' +
            '<div style="width:'+pct+'%;height:100%;background:'+(low?"var(--bad)":"var(--accent)")+';"></div>' +
          '</div>' +
        '</div>';
      }).join("") : '<div class="empty" style="padding:12px 0;">No closing counts logged yet.</div>';
      var restockRows = restocks.length ? restocks.map(function(r){
        return '<div class="list-row"><div class="main"><div class="t" style="font-size:13px;">+'+r.amountG+' g</div><div class="s">'+escapeHtml(r.employeeName)+(r.note?' - '+escapeHtml(r.note):'')+'</div></div><div class="s tabular">'+fmtDateTime(r.createdAt)+'</div></div>';
      }).join("") : '<div class="empty" style="padding:10px 0;">No deliveries logged yet.</div>';
      return '<div class="card" style="margin-top:12px;">' +
        '<div class="eyebrow">'+escapeHtml(f.name)+'</div>' +
        '<div class="s muted" style="margin-top:2px;">Current: '+(f.lastStockG||0)+' g - threshold '+f.thresholdG+' g</div>' +
        '<div style="margin-top:10px;"><div class="s" style="font-weight:700;margin-bottom:2px;">Closing stock, last '+(hist.length||0)+' days</div>'+trendRows+'</div>' +
        '<div style="margin-top:12px;"><div class="s" style="font-weight:700;margin-bottom:2px;">Recent deliveries</div>'+restockRows+'</div>' +
      '</div>';
    }).join("") || '<div class="empty">No flavours yet.</div>';
    return backRow("Manage") +
    '<h1 style="font-size:20px;">Stock log</h1>' +
    '<p class="muted" style="font-size:12.5px;margin-top:-6px;">Closing stock-out counts and stock deliveries, by flavour, based on the last '+state.events.length+' logged events.</p>' +
    cards;

  /* ---- Stock check vs Square ---- */
  // Staff see sold grams and which flavours to re-weigh; the boss also sees
  // missing, drying and taster estimates.
  function renderCheckRows(check, detailed){
    return (check.rows||[]).map(function(r){
      var pill = r.flag === "short" ? '<span class="pill low">Check</span>' : (r.flag === "over" ? '<span class="pill pending">Check</span>' : (r.missingG == null ? '' : '<span class="pill open">OK</span>'));
      var sub = "Sold in Square " + fmtG(r.soldG);
      if(r.missingG == null){ sub += " - no Stock-In today to compare"; }
      else if(detailed){
        sub += " - opened " + fmtG(r.openG) + (r.deliveredG ? " + " + fmtG(r.deliveredG) + " delivered" : "") + ", closed " + fmtG(r.closeG) +
          "<br>Missing " + fmtG(r.missingG) + ": drying " + (r.dryingG == null ? "not known yet" : "~" + fmtG(r.dryingG)) +
          ", tasters ~" + fmtG(r.tastersG) + (r.tasterCents != null ? " (" + fmtMoney(r.tasterCents/100) + ")" : "");
      }
      if(r.flag === "short") sub += "<br><b style=\"color:var(--bad);\">More missing than usual - re-weigh, and check every sale went through Square.</b>";
      if(r.flag === "over") sub += "<br><b style=\"color:var(--warn);\">More on the scale than expected - re-weigh, or log a missed delivery.</b>";
      return '<div class="list-row">' +
        '<div class="main"><div class="t">'+escapeHtml(r.name)+'</div><div class="s">'+sub+'</div></div>' + pill +
      '</div>';
    }).join("");
  }
  function renderCheckExtras(check){
    var out = "";
    if((check.unmatched||[]).length){
      out += '<p class="s" style="margin-top:10px;color:var(--warn);">Square items not matched to a flavour: ' + escapeHtml(check.unmatched.map(function(u){ return u.name + " (" + fmtG(u.grams) + ")"; }).join(", ")) + '. Set the Square item name on the flavour under Manage -> Flavours.</p>';
    }
    if((check.unweighed||[]).length){
      out += '<p class="s muted" style="margin-top:6px;">Sold per piece, not by weight (not counted): ' + escapeHtml(check.unweighed.map(function(u){ return u.name + " x" + u.qty; }).join(", ")) + '.</p>';
    }
    return out;
  }

  function renderStockCheckResult(){
    var check = latestStockCheck(todayKey());

    var nf = (check.flagged||[]).length;
    return backRow("Home") +

      '<div class="eyebrow">Stock check</div>' +
      '<h1 style="font-size:19px;margin-top:6px;">'+(nf ? nf+' flavour'+(nf>1?'s':'')+' to check' : 'Stock matches Square sales')+'</h1>' +
      '<p class="muted" style="font-size:13px;margin-top:6px;">Your Stock-Out is saved. It was compared with '+check.orders+' Square orders since Stock-In.'+(nf ? ' If a re-weigh gives a different number, just do Stock-Out again.' : '')+'</p>' +

  function renderAdminStockCheck(){
    var cfg = getSquareConfig();
    var byDay = {}; var days = [];
    state.events.forEach(function(e){
      if(e.type === "sales" && !byDay[e.day]){ byDay[e.day] = e; days.push(e.day); }
    });
    days = days.slice(0, 14);
    var totals = { sold:0, tasters:0, tasterCents:0, drying:0, flagged:0 };
    days.slice(0, 7).forEach(function(d){
      var c = byDay[d];
      if((c.flagged||[]).length) totals.flagged++;
      (c.rows||[]).forEach(function(r){
        totals.sold += r.soldG||0; totals.tasters += r.tastersG||0; totals.drying += r.dryingG||0; totals.tasterCents += r.tasterCents||0;
      });
    });
    var summary = days.length ?
      '<div class="card">' +
        '<div class="eyebrow">Last '+Math.min(7, days.length)+' checked days</div>' +
        '<div class="list-row"><div class="main"><div class="t">Sold (Square)</div></div><div class="tabular">'+fmtG(totals.sold)+'</div></div>' +
        '<div class="list-row"><div class="main"><div class="t">Tasters (estimate)</div><div class="s">What went missing after drying is taken off</div></div><div class="tabular">'+fmtG(totals.tasters)+(totals.tasterCents ? ' - '+fmtMoney(totals.tasterCents/100) : '')+'</div></div>' +
        '<div class="list-row"><div class="main"><div class="t">Drying (estimate)</div><div class="s">From the overnight drop between Stock-Out and next Stock-In</div></div><div class="tabular">'+fmtG(totals.drying)+'</div></div>' +
        '<div class="list-row"><div class="main"><div class="t">Days with a flavour to check</div></div><div class="tabular">'+totals.flagged+'</div></div>' +
      '</div>' : '';
    var dayCards = days.map(function(d){
      var c = byDay[d];
      return '<div class="card" style="margin-top:12px;">' +
        '<div class="eyebrow">'+d+' - '+c.orders+' Square orders</div>' +
        '<div style="padding-block:4px;">'+renderCheckRows(c, true)+'</div>' + renderCheckExtras(c) +
      '</div>';
    }).join("") || '<div class="card empty">No stock checks yet. One runs automatically at every Stock-Out once Square is set up.</div>';
    return backRow("Manage") +
    '<h1 style="font-size:20px;">Stock check</h1>' +
    '<div class="card">' +
      '<p style="font-size:13.5px;">'+(cfg ? '<b style="color:var(--good);">Square is set up</b> - every Stock-Out is compared with Square sales since that day\'s Stock-In.' : '<b style="color:var(--warn);">Square is not set up yet</b> - Stock-Out works as normal without the check.')+'</p>' +
      '<p class="muted" style="font-size:12.5px;margin-top:8px;">Missing = opening + deliveries - sold in Square - closing. Drying is estimated from the overnight drop, so Stock-In must be a real weigh-in each morning. The rest is counted as tasters. A flavour is flagged when more than '+RECON_TOLERANCE_G+' g and '+RECON_TOLERANCE_PCT+'% of its sales goes missing beyond drying.</p>' +
      (cfg ? '<div class="btnrow" style="margin-top:12px;"><button class="btn btn-primary" style="flex:1;" id="btn-run-stockcheck">Re-check today</button><button class="btn btn-ghost" id="btn-test-square">Test connection</button></div>' : '') +
    '</div>' +
    summary + dayCards;
  }

  /* ============================= HELPERS ============================== */
  function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function escapeAttr(s){ return escapeHtml(s); }

  function renderBootError(err){
    var msg = (err && err.message) || String(err);
    var isPerm = /permission/i.test(msg);
    var isTimeout = err && err.isTimeout;
    return '<div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:20px;">' +
      '<div class="login-hero"><div class="mark" style="background:var(--bad);">!</div><h1>Can\'t reach the database</h1></div>' +
      '<div class="card">' +
        (isTimeout ?
          '<p style="font-size:13.5px;">The database never responded. If you\'re opening this from a Claude-hosted preview link, that\'s expected - this preview\'s sandbox blocks the live network connections Firestore needs. It will work once this page is hosted on a normal website (GitHub Pages, Firebase Hosting, Netlify, etc.) instead of opened as a Claude artifact link.</p>' +
          '<p class="muted" style="font-size:12.5px;margin-top:8px;">If you\'ve already hosted it elsewhere and still see this, double-check your Firestore rules are published and your device has internet access.</p>'
        : isPerm ?
          '<p style="font-size:13.5px;">Firestore is blocking every request. This almost always means the security rules haven\'t been published yet - a brand new Firestore project denies everything until you paste in rules.</p>' +
          '<p class="muted" style="font-size:12.5px;margin-top:8px;">In the Firebase console: Firestore Database -> Rules tab -> paste the rules Claude gave you -> Publish. Then reload this app.</p>'
          :
          '<p style="font-size:13.5px;">Something went wrong talking to Firestore.</p><p class="muted" style="font-size:12px;margin-top:8px;word-break:break-word;">'+escapeHtml(msg)+'</p>'
        ) +
        '<button class="btn btn-ghost" style="width:100%;margin-top:14px;" id="btn-retry-boot">Try again</button>' +
        '<button class="btn btn-danger" style="width:100%;margin-top:10px;" id="btn-revert-demo">Switch back to demo mode</button>' +
      '</div>' +
    '</div>';
  }

  function bindLogin(){
    bindInstallBanner();
    document.querySelectorAll("[data-key]").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(state.pin.length >= PIN_LENGTH) return;
        state.pin += btn.getAttribute("data-key");
        state.pinError = "";
        if(state.pin.length === PIN_LENGTH) tryLogin();
        else render();
      });
    });
    var del = document.getElementById("key-del");
    if(del) del.addEventListener("click", function(){
      state.pin = state.pin.slice(0,-1);
      state.pinError = "";
      render();
    });
  }

  function tryLogin(){
    render();
    setTimeout(function(){
      var emp = state.employees.find(function(e){ return e.pin === state.pin; });
      if(emp){
        state.employee = emp;
        state.pin = "";
        state.pinError = "";
        try{ localStorage.setItem(LS_SESSION, emp.id); }catch(e){}
        go("home");
      }else{
        state.pinError = "PIN not recognised";
        state.pin = "";
        render();
      }
    }, 120);
  }

  /* ============================= SCREEN BINDINGS ============================== */

  function bindScreen(){
    bindInstallBanner();
    var back = document.getElementById("btn-back");
    if(back) back.addEventListener("click", function(){ go(state.screen.indexOf("admin-")===0 ? "admin" : "home"); });

    var logout = document.getElementById("btn-logout");
    if(logout) logout.addEventListener("click", function(){
      state.employee = null; state.pin = "";
      try{ localStorage.removeItem(LS_SESSION); }catch(e){}
      go("login");
    });

    document.querySelectorAll("[data-go]").forEach(function(btn){
      btn.addEventListener("click", function(){
        go(btn.getAttribute("data-go"), { dir: btn.getAttribute("data-dir") });
      });
    });

    // Time
    var clockEl = document.getElementById("live-clock");
    if(clockEl){
      clearInterval(bindScreen._clockTimer);
      bindScreen._clockTimer = setInterval(function(){ clockEl.textContent = fmtTime(Date.now()); }, 1000);
    }
    var subT = document.getElementById("btn-submit-time");
    if(subT) subT.addEventListener("click", function(){
      var dir = state.formData.dir;
      DB.logEvent({ type:"time", dir:dir, employeeId:state.employee.id, employeeName:state.employee.name }).then(function(){
        toast("Time-"+(dir==="in"?"in":"out")+" logged at "+fmtTime(Date.now()));
        return refreshEvents();
      }).then(function(){ go("home"); }).catch(reportSaveError);
    });

    // Stock
    var subS = document.getElementById("btn-submit-stock");
    if(subS) subS.addEventListener("click", function(){
      var dir = subS.getAttribute("data-dir");
      var rows = document.querySelectorAll(".weigh-row");
      var readings = {}; var flagged = []; var ok = true;
      rows.forEach(function(row){
        var id = row.getAttribute("data-flavour");
        var val = parseFloat(row.querySelector(".weigh-input").value);
        if(isNaN(val)){ ok = false; row.querySelector(".weigh-input").style.borderColor = "var(--bad)"; return; }
        readings[id] = val;
      });
      if(!ok){ toast("Enter a weight for every flavour"); return; }
      var updates = state.flavours.map(function(f){
        var w = readings[f.id];
        if(dir === "out" && w <= f.thresholdG) flagged.push(f.name);
        return DB.updateStockReading(f.id, w);
      });
      var savedEvt = null;
      Promise.all(updates).then(function(){
        return DB.logEvent({ type:"stock", dir:dir, employeeId:state.employee.id, employeeName:state.employee.name, readings:readings, flagged:flagged });
      }).then(function(evt){
        savedEvt = evt;
        if(flagged.length){ toast("Saved. Low stock: "+flagged.join(", ")); }
        else{ toast("Stock-"+dir+" saved"); }
        return refreshAll();
      }).then(function(){
        if(dir !== "out" || !getSquareConfig()) return go("home");
        toast("Checking against Square sales...");
        return runStockCheck(savedEvt).then(function(check){ go(check ? "stockcheck" : "home"); });
      }).catch(reportSaveError);
    });

    // Cash
    var cashTotalEl = document.getElementById("cash-total");
    if(cashTotalEl){
      document.querySelectorAll(".denom-input").forEach(function(inp){
        inp.addEventListener("input", function(){
          cashTotalEl.textContent = fmtMoney(computeCashTotal());
        });
      });
    }
    var subC = document.getElementById("btn-submit-cash");
    if(subC) subC.addEventListener("click", function(){
      var dir = subC.getAttribute("data-dir");
      var breakdown = {};
      document.querySelectorAll(".weigh-row[data-denom]").forEach(function(row){
        var count = parseInt(row.querySelector(".denom-input").value, 10) || 0;
        if(count > 0) breakdown[row.getAttribute("data-denom")] = count;
      });
      var amt = computeCashTotal();
      if(amt <= 0){ toast("Enter at least one note or coin"); return; }
      DB.logEvent({ type:"cash", dir:dir, employeeId:state.employee.id, employeeName:state.employee.name, amount:amt, breakdown:breakdown }).then(function(){
        toast("Cash-"+dir+" saved: "+fmtMoney(amt));
        return refreshEvents();
      }).then(function(){
        if(dir === "out"){ sendDailyReport(); }
        go("home");
      }).catch(reportSaveError);
    });

    // Stock delivery (restock)
    var subR = document.getElementById("btn-submit-restock");
    if(subR) subR.addEventListener("click", function(){
      var flavourId = document.getElementById("restock-flavour").value;
      var amount = parseFloat(document.getElementById("restock-amount").value);
      var note = document.getElementById("restock-note").value.trim();
      var f = state.flavours.find(function(x){ return x.id === flavourId; });
      if(!f || isNaN(amount) || amount <= 0){ toast("Pick a flavour and enter an amount"); return; }
      DB.addStockDelivery(f.id, amount).then(function(){
        return DB.logEvent({ type:"restock", employeeId:state.employee.id, employeeName:state.employee.name, flavourId:f.id, flavourName:f.name, amountG:amount, note:note });
      }).then(function(){
        toast("Logged +"+amount+"g delivery for "+f.name);
        return refreshAll();
      }).then(function(){ go("home"); }).catch(reportSaveError);
    });

    // Admin: re-run today's stock check against Square
    var rerun = document.getElementById("btn-run-stockcheck");
    if(rerun) rerun.addEventListener("click", function(){
      var day = todayKey();
      var outEvt = state.events.find(function(e){ return e.type === "stock" && e.dir === "out" && todayKey(new Date(e.createdAt)) === day; });
      if(!outEvt){ toast("No Stock-Out logged today yet"); return; }
      toast("Checking against Square sales...");
      runStockCheck(outEvt).then(function(check){ if(check){ toast("Stock check saved"); } render(); });
    });
    var testSq = document.getElementById("btn-test-square");
    if(testSq) testSq.addEventListener("click", function(){
      toast("Contacting Square...");
      squareGet("/status").then(function(j){
        toast("Square connected: " + ((j.locations||[]).join(", ") || "no active locations"));

        publicKey: document.getElementById("ej-key").value.trim(),
        toEmail: document.getElementById("ej-to").value.trim()
      };

    var testEj = document.getElementById("btn-test-email");

      sendDailyReport().then(function(){ toast("Test email sent - check your inbox"); });

    // Admin: flavours
    var addFl = document.getElementById("btn-add-flavour");
    if(addFl) addFl.addEventListener("click", function(){ go("admin-flavour-edit", {id:null}); });

      btn.addEventListener("click", function(){ go("admin-flavour-edit", {id: btn.getAttribute("data-edit-flavour")}); });
    });
    var saveFl = document.getElementById("btn-save-flavour");
    if(saveFl) saveFl.addEventListener("click", function(){
      var id = saveFl.getAttribute("data-id") || uid();
      var name = document.getElementById("fl-name").value.trim();
      var threshold = parseFloat(document.getElementById("fl-threshold").value) || 0;
      var stock = parseFloat(document.getElementById("fl-stock").value) || 0;
      var squareName = document.getElementById("fl-square").value.trim();
      if(!name){ toast("Give it a name"); return; }
      DB.saveFlavour({ id:id, name:name, squareName:squareName, thresholdG:threshold, lastStockG:stock, lastStockAt:Date.now() }).then(function(){
        toast("Saved");
        return refreshAll();
      }).then(function(){ go("admin-flavours"); }).catch(reportSaveError);
    });
    var delFl = document.getElementById("btn-delete-flavour");
    if(delFl) delFl.addEventListener("click", function(){
      DB.deleteFlavour(delFl.getAttribute("data-id")).then(refreshAll).then(function(){ go("admin-flavours"); }).catch(reportSaveError);
    });

    // Admin: employees
    var addEmp = document.getElementById("btn-add-employee");
    if(addEmp) addEmp.addEventListener("click", function(){ go("admin-employee-edit", {id:null}); });
    document.querySelectorAll("[data-edit-employee]").forEach(function(btn){
      btn.addEventListener("click", function(){ go("admin-employee-edit", {id: btn.getAttribute("data-edit-employee")}); });
    });
    var saveEmp = document.getElementById("btn-save-employee");
    if(saveEmp) saveEmp.addEventListener("click", function(){
      var id = saveEmp.getAttribute("data-id") || uid();
      var name = document.getElementById("emp-name").value.trim();
      var pin = document.getElementById("emp-pin").value.trim().toUpperCase();
      var isAdmin = document.getElementById("emp-admin").checked;
      if(!name || !PIN_PATTERN.test(pin)){ toast("Name and a 6-character code (0-9, A-C) are required"); return; }
      var clash = state.employees.find(function(e){ return e.pin === pin && e.id !== id; });
      if(clash){ toast("That PIN is already used by "+clash.name); return; }
      DB.saveEmployee({ id:id, name:name, pin:pin, isAdmin:isAdmin }).then(function(){

        setTimeout(function(){ location.reload(); }, 700);
      }catch(e){
        toast("That doesn't look like a valid Firebase config");
      }
    });
    var clearCfg = document.getElementById("btn-clear-config");
    if(clearCfg) clearCfg.addEventListener("click", function(){
      DB.clearCloudConfig();
      toast("Override removed. Reloading...");
      setTimeout(function(){ location.reload(); }, 700);
    });
  }

  /* ============================= LOADING / BOOT ============================== */

  function refreshEvents(){
    return DB.getEvents(400).then(function(evs){ state.events = evs; });
  }
  function refreshAll(){
    return Promise.all([DB.getEmployees(), DB.getFlavours(), DB.getEvents(400)]).then(function(r){
      state.employees = r[0]; state.flavours = r[1]; state.events = r[2];
    });
  }

  // A freshly-connected Firestore project has no employees yet, which would
  // otherwise lock everyone out (there's nothing to log in with). Bootstrap
  // one owner account so the person who just connected can get in and add
  // real staff/flavours from the Manage menu.
  function ensureOwnerSeed(){
    if(!DB.isCloud()) return Promise.resolve();
    if(state.employees.length > 0) return Promise.resolve();
    return DB.saveEmployee({ name:"Owner", pin:"9A9B9C", isAdmin:true }).then(refreshAll);
  }

  function boot(initialData){
    state.loading = true; render();
    var timedOut = false;
    var timeoutMs = DB.isCloudConfigured() ? 9000 : 20000;
    var timer = setTimeout(function(){
      timedOut = true;
      var e = new Error("timeout");
      e.isTimeout = true;
      state.loading = false;
      state.bootError = e;
      render();
    }, timeoutMs);

    DB.init().then(refreshAll).then(ensureOwnerSeed).then(function(){
      if(timedOut) return;
      clearTimeout(timer);
      state.loading = false;
      var sessId = null;
      try{ sessId = localStorage.getItem(LS_SESSION); }catch(e){}
      if(sessId){
        var emp = state.employees.find(function(e){ return e.id === sessId; });
        if(emp) state.employee = emp;
      }
      if(initialData && initialData.screen){ state.screen = initialData.screen; }
      render();
    }).catch(function(err){
      if(timedOut) return;
      clearTimeout(timer);
      console.error("Boot failed:", err);
      state.loading = false;
      state.bootError = err;
      render();
    });
  }

  // Hot-reload friendly boot for the artifact runtime, if present.
  if(window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot(window.claude.hot.data || {});
  } else {
    boot({});
  }
})();
</script>
